name: Large diff model benchmark

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Public rboto PR with or without the generated service-model blob
        type: choice
        options: [full, reduced, both]
        default: full
      model:
        description: Compare both models before changing prompts
        type: choice
        options: [both, opus-4.8, opus-5]
        default: both
      runs:
        description: Repetitions per model and size (one is a pilot, three tests repeatability)
        type: choice
        options: ["1", "3"]
        default: "1"
      prompt:
        description: Optional committed filename under benchmarks/large-diff/prompts
        type: string
        default: ""

permissions: {}

concurrency:
  group: large-diff-model-benchmark
  cancel-in-progress: false

jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    environment: ai-pr-review-runtime
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'both' && '["full","reduced"]' || format('["{0}"]', inputs.variant)) }}
        model: ${{ fromJSON(inputs.model == 'both' && '["opus-4.8","opus-5"]' || format('["{0}"]', inputs.model)) }}
    env:
      PYTHONHASHSEED: "0"
      AWS_REGION: eu-west-1
    steps:
      - name: Check out benchmark
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check out pinned Aceiro harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: svozza/aceiro
          ref: c7559e28b021f0cb291a95f72b87f91286244b5f
          path: harness
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: false
      - name: Install frozen harness dependencies
        run: uv sync --project harness --frozen --no-install-project
      - name: Configure model-only AWS session
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          inline-session-policy: >-
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"],
                "Resource": [
                  "arn:aws:bedrock:eu-west-1:*:inference-profile/global.anthropic.claude-${{ matrix.model == 'opus-5' && 'opus-5' || 'opus-4-8' }}",
                  "arn:aws:bedrock:*::foundation-model/anthropic.claude-${{ matrix.model == 'opus-5' && 'opus-5' || 'opus-4-8' }}"
                ]
              }]
            }
      - name: Run comparison
        env:
          MODEL: ${{ matrix.model }}
          VARIANT: ${{ matrix.variant }}
          RUNS: ${{ inputs.runs }}
          PROMPT_VARIANT: ${{ inputs.prompt }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          DISABLE_AUTOUPDATER: "1"
        run: |
          args=()
          if [ -n "$PROMPT_VARIANT" ]; then
            args+=(--prompt "$PROMPT_VARIANT")
          fi
          harness/.venv/bin/python benchmarks/large-diff/run.py \
            --harness harness \
            --variant "$VARIANT" --model "$MODEL" --runs "$RUNS" \
            --work-dir "$RUNNER_TEMP/large-diff-work" \
            --output-dir "$RUNNER_TEMP/large-diff-results" \
            "${args[@]}"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: large-diff-${{ matrix.variant }}-${{ matrix.model }}
          path: ${{ runner.temp }}/large-diff-results
          if-no-files-found: warn
          retention-days: 30
