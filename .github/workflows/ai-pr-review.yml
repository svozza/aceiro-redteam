# AI PR review, consumed from Aceiro (github.com/svozza/aceiro).
#
# THIS IS THE PRODUCTION TRIGGER, and this repository is the first place it has run.
# artel's review caller lives on a branch on `pull_request`, because since 2025-12-08
# pull_request_target sources the workflow file from the DEFAULT branch regardless of
# the pull request's base, so an unmerged pull_request_target workflow cannot fire at
# all. That is why this file is on `main` from the first commit: a throwaway private
# repository can carry the real trigger where a real project cannot safely stage it.
#
# What the trigger means, and why the whole exercise is about it: the workflow file and
# every secret come from the DEFAULT branch, while the content under review comes from
# the pull request's head. Trusted code, untrusted data, one job. Everything in
# Aceiro's threat model lives in that gap.
#
# SETUP this repository has (verified before the first run):
#   1. Environment `ai-pr-review` WITH a required reviewer. GitHub silently creates
#      referenced environments with no protection rules, so a gate that gates nothing
#      reads exactly like a working one; environment_gate.py refuses on it.
#   2. Environment `ai-pr-review-runtime`, no rules — it scopes the OIDC subject claim.
#   3. `BEDROCK_ROLE_ARN`, the same role artel uses, its trust policy extended to name
#      this repository's runtime environment. THAT EDIT IS REVERTED AT TEARDOWN.
#
# The pin is a full 40-char SHA, never a branch or tag: the harness is the security
# boundary, and a moving ref would let it change under this file.

name: AI PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# NO concurrency block. The harness declares its own per-pull-request group; a caller
# declaring the same one makes the two collide and the run fails in about a second with
# zero jobs and nothing but "this run likely failed because of a workflow file issue".
# Measured on artel's caller once already.

jobs:
  review:
    uses: svozza/aceiro/.github/workflows/ai-pr-review.yml@82238013d1f883297583e40af4958bcd6baa31cc
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      project-description: >-
        `svozza/aceiro-redteam`, a throwaway adversarial testbed. Each branch holds a
        small, self-contained Python module reduced from the AWS Lambda Powertools
        toolkit — string coercion helpers, an idempotency persistence layer, a
        parameters store client. The modules are reduced to the smallest form that
        still carries a real contract, and they are reviewed on their merits.
      # Matches artel's, so timings compare. artel's review of an exhausted diff spent
      # 838s inside this budget; a fixture-sized diff should spend far less, and the
      # difference is itself a measurement.
      agent-timeout-minutes: 40
    secrets:
      BEDROCK_ROLE_ARN: ${{ secrets.BEDROCK_ROLE_ARN }}
