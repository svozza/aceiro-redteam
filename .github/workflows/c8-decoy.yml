# C8: uploads a DECOY artifact carrying the exact name a real review upload uses,
# from an unrelated run. fetch_reviewed_artifact must reject it on workflow_run.id.
name: C8 decoy artifact
on:
  workflow_dispatch:
    inputs:
      artifact-name:
        description: Exact artifact name to squat.
        required: true
permissions: {}
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: c8-decoy/
          if-no-files-found: error
