name: Benchmark checks

on:
  pull_request:
    paths:
      - benchmarks/**
      - .github/workflows/large-diff-benchmark.yml
      - .github/workflows/benchmark-checks.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: false
      - name: Test fixture preparation and result accounting
        run: uv run --no-project python -m unittest discover -s benchmarks/large-diff/tests -v
